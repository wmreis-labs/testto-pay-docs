site_name: Testto Pay
site_description: Documentação pública do Testto Pay, cobrança por link do ecossistema Testto.
site_url: https://wmreis-labs.github.io/testto-pay-docs/
repo_url: https://github.com/wmreis-labs/testto-pay-docs
repo_name: wmreis-labs/testto-pay-docs
docs_dir: docs

theme:
  name: material
  language: pt
  logo: assets/testto-pay-mark.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/testto.css
  - https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap

plugins:
  - search:
      lang:
        - pt
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Identidade visual: identidade.md
  - Mudanças:
      - mudancas/index.md
      - Design docs:
          - mudancas/design/index.md
          - Console, cobranças: mudancas/design/2026-11-21-console-cobrancas.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wmreis-labs/testto-pay-docs
